name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest runners ship with the Android SDK preinstalled.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Collect release files
        run: |
          mkdir out
          cp app/build/outputs/apk/debug/app-debug.apk out/ShabbatWatch.apk
          cp scripts/install.ps1 out/install.ps1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShabbatWatch
          path: out/

      - name: Create/refresh "latest" release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: מצב שבת – גרסה עדכנית
          body: להתקנה על השעון - הורד/י את ShabbatWatch.apk ואת install.ps1 לאותה תיקייה במחשב, והרץ/י את install.ps1 (הוראות ב-README).
          files: |
            out/ShabbatWatch.apk
            out/install.ps1
          make_latest: true
